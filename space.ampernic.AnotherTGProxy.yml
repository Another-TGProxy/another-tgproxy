# Flatpak manifest for the AnotherTGProxy GUI. It builds the mtproxy-ws core into
# /app first, then the GTK4 front-end against it.
#
#   flatpak install -y flathub org.gnome.Sdk//49 org.gnome.Platform//49 org.flatpak.Builder
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#       build-flatpak gui/space.ampernic.AnotherTGProxy.yml      # run from repo root
#   flatpak run space.ampernic.AnotherTGProxy
#
# Under Flatpak the daemon's Background-portal SetStatus works, so the app shows
# in GNOME's "Background Apps" panel (natively the portal forbids it).
app-id: space.ampernic.AnotherTGProxy
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: tg-ws-proxy

finish-args:
  - --share=network          # proxy listens on 127.0.0.1:1443 + dials Telegram/CF
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.gnome.Shell.Extensions      # detect/toggle the quick-settings extension
  # NOTE: SNI tray under Flatpak needs TrayStatus to register by unique bus name
  # (can't --own-name a hyphenated org.kde.StatusNotifierItem-PID-1). Deferred;
  # on GNOME the portal "Background" mode is the right default under Flatpak anyway.

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/vala
  - '*.a'

modules:
  # The self-contained proxy core (libmtproxyws + headers + vapi/pc). Once core
  # lives in its own repo, replace the source with a `type: git` entry.
  - name: mtproxy-ws
    buildsystem: meson
    config-opts:
      - --buildtype=release
    sources:
      - type: dir
        path: ../core

  # The GTK4 front-end, linked against the core above.
  - name: tg-ws-proxy
    buildsystem: meson
    config-opts:
      - --buildtype=release
    sources:
      - type: dir
        path: .
