name: Publish Flatpak

# Publishes this app to the Ampernic Flatpak repo (flatpak.ampernic.space).
# push to main -> devel channel; pushing a tag -> stable channel.
# The build itself runs in Ampernic/flatpak; here we only resolve the exact
# commits, render the self-contained manifest, and dispatch it.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'data/**'
      - 'po/**'
      - 'meson.build'
      - 'packaging/flatpak/**'
      - '.github/workflows/publish-flatpak.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve channel + commits, render manifest
        run: |
          set -euo pipefail
          # core + libstation commits come from the pinned wraps — the single
          # source of truth shared with every platform. The channel (stable on a
          # tag, devel on a branch) only decides where it is published, not which
          # core/libstation goes in.
          CORE_COMMIT=$(sed -n 's/^revision = //p' subprojects/mtproxy-ws.wrap | head -1)
          STATION_COMMIT=$(sed -n 's/^revision = //p' subprojects/libstation.wrap | head -1)
          GUI_COMMIT='${{ github.sha }}'
          if [ "${{ github.ref_type }}" = tag ]; then CHANNEL=stable; else CHANNEL=devel; fi

          sed -e "s/__CORE_COMMIT__/$CORE_COMMIT/g" \
              -e "s/__GUI_COMMIT__/$GUI_COMMIT/g" \
              -e "s/__STATION_COMMIT__/$STATION_COMMIT/g" \
              -e "/__GUI_VERSION_OPT__/d" \
              packaging/flatpak/space.ampernic.AnotherTGProxy.yml > manifest.yml

          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "channel=$CHANNEL  gui=${GUI_COMMIT:0:12}  core=${CORE_COMMIT:0:12}  station=${STATION_COMMIT:0:12}"

      - name: Dispatch to Ampernic/flatpak
        env:
          TOKEN: ${{ secrets.FLATPAK_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::FLATPAK_DISPATCH_TOKEN not set — skipping publish"
            exit 0
          fi
          payload=$(jq -n \
            --arg id  'space.ampernic.AnotherTGProxy' \
            --arg ch  "$CHANNEL" \
            --arg m   "$(base64 -w0 manifest.yml)" \
            --arg rt  '49' \
            '{event_type:"publish",
              client_payload:{app_id:$id, channel:$ch, manifest_b64:$m, runtime_version:$rt}}')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Ampernic/flatpak/dispatches \
            -d "$payload")
          echo "dispatch HTTP $code"
          [ "$code" = 204 ]
