name: AppImage

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: &paths
      - 'src/**'
      - 'data/**'
      - 'po/**'
      - 'meson.build'
      - 'subprojects/**'
      - '.github/workflows/appimage.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    # The GUI needs libadwaita >= 1.7 (Adw.WrapBox / Adw.ToggleGroup), newer than
    # the default runner ships, so build inside an Ubuntu 25.04 (GNOME 48) container.
    container: ubuntu:25.04
    steps:
      - name: Install build + bundling tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential meson ninja-build valac blueprint-compiler gettext \
            pkg-config git wget ca-certificates file desktop-file-utils patchelf \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev libssl-dev \
            libglib2.0-dev libglib2.0-bin \
            librsvg2-common gdk-pixbuf2.0-bin adwaita-icon-theme \
            gsettings-desktop-schemas libgtk-4-bin

      - name: Checkout GUI
        uses: actions/checkout@v4

      - name: Checkout core (mtproxy-ws)
        uses: actions/checkout@v4
        with:
          repository: Another-TGProxy/mtproxy-ws
          path: _core

      - name: Build + install core
        run: |
          meson setup _core/build _core --prefix=/usr --buildtype=release
          meson install -C _core/build

      - name: Build + stage GUI into AppDir
        run: |
          meson setup build --prefix=/usr --buildtype=release
          DESTDIR="$PWD/AppDir" meson install -C build

      - name: Bundle libraries with sharun (incl. glibc + loader)
        run: |
          ARCH=x86_64
          wget -qO sharun https://github.com/VHSgunzo/sharun/releases/latest/download/sharun-$ARCH-aio
          chmod +x sharun
          # lib4bin pulls the binary + every shared lib it needs — including glibc and
          # the dynamic loader — into AppDir/shared, so the AppImage runs on older glibc.
          ./sharun lib4bin --hard-links --with-hooks --strip --gen-lib-path --dst-dir AppDir \
            AppDir/usr/bin/another-tgproxy \
            /usr/lib/$ARCH-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders/*.so \
            /usr/lib/$ARCH-linux-gnu/gio/modules/*.so
          # Bundle the Adwaita icon theme so the UI's symbolic icons resolve.
          cp -r /usr/share/icons/Adwaita AppDir/usr/share/icons/ 2>/dev/null || true
          # AppImage AppDir entrypoint: AppRun -> sharun; .app names the bin to launch.
          ln -f AppDir/sharun AppDir/AppRun
          echo 'another-tgproxy' > AppDir/.app
          cp AppDir/usr/share/applications/space.ampernic.AnotherTGProxy.desktop AppDir/
          cp AppDir/usr/share/icons/hicolor/scalable/apps/space.ampernic.AnotherTGProxy.svg AppDir/
          cp AppDir/space.ampernic.AnotherTGProxy.svg AppDir/.DirIcon

      - name: Pack AppImage (uruntime + DwarFS)
        run: |
          VERSION=$(sed -n "s/.*version: '\([0-9.]*\)'.*/\1/p" meson.build | head -1)
          OUT="AnotherTGProxy-$VERSION-linux-x86_64.AppImage"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          wget -qO uruntime https://github.com/VHSgunzo/uruntime/releases/latest/download/uruntime-appimage-dwarfs-x86_64
          chmod +x uruntime
          ./uruntime --appimage-mkdwarfs -f -i AppDir -o "$OUT" --header ./uruntime
          chmod +x "$OUT"
          ls -la "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: another-tgproxy-linux-x86_64
          path: ${{ env.OUT }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUT }}
          generate_release_notes: true
