name: AppImage

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    # The GUI needs libadwaita >= 1.7 (Adw.WrapBox / Adw.ToggleGroup), newer than
    # the default runner ships, so build inside an Ubuntu 25.04 (GNOME 48) container.
    container: ubuntu:25.04
    steps:
      - name: Install build + bundling tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential meson ninja-build valac blueprint-compiler gettext \
            pkg-config git wget ca-certificates file desktop-file-utils patchelf \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev libssl-dev \
            libglib2.0-dev libglib2.0-bin \
            librsvg2-common gdk-pixbuf2.0-bin adwaita-icon-theme \
            gsettings-desktop-schemas libgtk-4-bin

      - name: Checkout GUI
        uses: actions/checkout@v4

      - name: Checkout core (mtproxy-ws)
        uses: actions/checkout@v4
        with:
          repository: Another-TGProxy/mtproxy-ws
          path: _core

      - name: Build + install core
        run: |
          meson setup _core/build _core --prefix=/usr --buildtype=release
          meson install -C _core/build

      - name: Build + stage GUI into AppDir
        run: |
          meson setup build --prefix=/usr --buildtype=release
          DESTDIR="$PWD/AppDir" meson install -C build

      - name: Fetch linuxdeploy + GTK plugin
        run: |
          mkdir -p tools
          wget -qO tools/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          # linuxdeploy-plugin-gtk has no releases; the script lives in the repo.
          wget -qO tools/linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x tools/linuxdeploy-x86_64.AppImage tools/linuxdeploy-plugin-gtk.sh

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1   # no FUSE in the container
          DEPLOY_GTK_VERSION: 4
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
          OUTPUT: another-tgproxy-x86_64.AppImage
        run: |
          export PATH="$PWD/tools:$PATH"   # let linuxdeploy find the gtk plugin
          tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --output appimage \
            --desktop-file AppDir/usr/share/applications/space.ampernic.AnotherTGProxy.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/space.ampernic.AnotherTGProxy.svg
          # The appimage plugin honours $OUTPUT, so the file is already named for us.
          ls -la "$OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: another-tgproxy-x86_64.AppImage
          path: another-tgproxy-x86_64.AppImage
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            another-tgproxy-x86_64.AppImage \
          || gh release upload "$GITHUB_REF_NAME" another-tgproxy-x86_64.AppImage --clobber
