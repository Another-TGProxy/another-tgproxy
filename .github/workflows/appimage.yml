name: AppImage

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: &paths
      - 'src/**'
      - 'data/**'
      - 'po/**'
      - 'meson.build'
      - 'subprojects/**'
      - '.github/workflows/appimage.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    # The GUI needs libadwaita >= 1.7 (Adw.WrapBox / Adw.ToggleGroup), newer than
    # the default runner ships, so build inside an Ubuntu 25.04 (GNOME 48) container.
    container: ubuntu:25.04
    steps:
      - name: Install build + bundling tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential meson ninja-build valac blueprint-compiler gettext \
            pkg-config git wget ca-certificates file desktop-file-utils patchelf \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev libssl-dev \
            libglib2.0-dev libglib2.0-bin \
            librsvg2-common gdk-pixbuf2.0-bin adwaita-icon-theme \
            gsettings-desktop-schemas libgtk-4-bin

      - name: Checkout GUI
        uses: actions/checkout@v6

      # The core (mtproxy-ws) and libstation are vendored meson subprojects
      # pinned in subprojects/*.wrap; meson fetches and builds them in-tree
      # during the GUI build (no system package on the runner), so there is no
      # separate core checkout — the wrap is the single source of truth.
      - name: Build + stage GUI into AppDir
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          [ -n "$VERSION" ] || VERSION=$(sed -n "s/.*version: '\([0-9.]*\)'.*/\1/p" meson.build | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Tag = release; untagged branch build = "development" (.Devel app-id/icon
          # + striped header), so it can't be mistaken for a release.
          PROFILE=development; APP_ID=space.ampernic.AnotherTGProxy
          [ -n "$RELEASE_VERSION" ] && PROFILE=default || APP_ID="$APP_ID.Devel"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          meson setup build --prefix=/usr --buildtype=release -Drelease_version="$VERSION" -Dprofile="$PROFILE"
          DESTDIR="$PWD/AppDir" meson install -C build

      - name: Bundle libraries with sharun (incl. glibc + loader)
        run: |
          ARCH=x86_64
          wget -qO sharun https://github.com/VHSgunzo/sharun/releases/latest/download/sharun-$ARCH-aio
          chmod +x sharun
          # lib4bin pulls the binary + every shared lib it needs — including glibc and
          # the dynamic loader — into AppDir/shared, so the AppImage runs on older glibc.
          # libstation is a vendored subproject installed only inside AppDir (not on
          # the host), so expose AppDir's libdir to ldd or lib4bin can't resolve it.
          export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib/$ARCH-linux-gnu:$PWD/AppDir/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./sharun lib4bin --hard-links --with-hooks --strip --gen-lib-path --dst-dir AppDir \
            AppDir/usr/bin/another-tgproxy \
            /usr/lib/$ARCH-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders/*.so \
            /usr/lib/$ARCH-linux-gnu/gio/modules/*.so
          # Bundle the Adwaita icon theme so the UI's symbolic icons resolve.
          cp -r /usr/share/icons/Adwaita AppDir/usr/share/icons/ 2>/dev/null || true
          # AppImage AppDir entrypoint: AppRun -> sharun; .app names the bin to launch.
          ln -f AppDir/sharun AppDir/AppRun
          echo 'another-tgproxy' > AppDir/.app
          cp "AppDir/usr/share/applications/$APP_ID.desktop" AppDir/
          cp "AppDir/usr/share/icons/hicolor/scalable/apps/$APP_ID.svg" AppDir/
          cp "AppDir/$APP_ID.svg" AppDir/.DirIcon

      - name: Pack AppImage (uruntime + DwarFS)
        run: |
          OUT="AnotherTGProxy-$VERSION-linux-x86_64.AppImage"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          wget -qO uruntime https://github.com/VHSgunzo/uruntime/releases/latest/download/uruntime-appimage-dwarfs-x86_64
          chmod +x uruntime
          ./uruntime --appimage-mkdwarfs -f -i AppDir -o "$OUT" --header ./uruntime
          chmod +x "$OUT"
          ls -la "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: another-tgproxy-linux-x86_64
          path: ${{ env.OUT }}
          if-no-files-found: error
        # On a tag, release.yml collects this artifact and publishes the release.
