name: Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: &paths
      - 'src/**'
      - 'data/**'
      - 'po/**'
      - 'meson.build'
      - 'subprojects/**'
      - 'packaging/windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout GUI
        uses: actions/checkout@v6

      # core (mtproxy-ws) + libstation are vendored meson subprojects pinned in
      # subprojects/*.wrap and built in-tree during the GUI build; no separate
      # core checkout.
      - name: Set up MSYS2 (ucrt64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vala
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-ca-certificates
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-vulkan-loader

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build app + installer (setup)
        env:
          MAKENSIS: /c/Program Files (x86)/NSIS/makensis.exe
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash packaging/windows/bundle-windows.sh

      # Upload the unsigned build as the input SignPath signs from.
      - name: Upload unsigned installer (SignPath input)
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: AnotherTGProxy-*-windows-x86_64-setup.exe
          retention-days: 1

      # SignPath pulls that artifact, Authenticode-signs it and returns the signed
      # installer into signed/. Release tags use the release policy, branch builds
      # the test policy.
      - name: Sign installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          project-slug: another-tgproxy
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # The distributed artifact is the signed installer when signing ran, else
      # the plain build output.
      - name: Collect installer (prefer signed)
        shell: bash
        run: |
          mkdir -p dist
          if ls signed/*.exe >/dev/null 2>&1; then
            cp signed/*.exe dist/
          else
            cp AnotherTGProxy-*-windows-x86_64-setup.exe dist/
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: another-tgproxy-windows-x86_64
          path: dist/*.exe
          retention-days: 14
        # On a tag, release.yml collects this artifact and publishes the release.
