name: Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: &paths
      - 'src/**'
      - 'data/**'
      - 'po/**'
      - 'meson.build'
      - 'subprojects/**'
      - 'packaging/windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # Authenticode signing via SignPath (free for OSS). Active only when the
    # SignPath secrets are configured AND this is a release tag, so ordinary
    # branch/PR builds stay green and unsigned. One-time setup on signpath.io:
    #   1. Create an org under the SignPath Foundation OSS program; install the
    #      SignPath GitHub App on this repo.
    #   2. Create a Project "another-tgproxy", an Artifact Configuration for the
    #      uploaded .exe, and a "release-signing" Signing Policy.
    #   3. Add repo secret SIGNPATH_API_TOKEN (a CI user token) + repo variable
    #      SIGNPATH_ORGANIZATION_ID. project-slug / signing-policy-slug below must
    #      match what you named in SignPath.
    env:
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && startsWith(github.ref, 'refs/tags/') }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout GUI
        uses: actions/checkout@v4

      - name: Checkout core (mtproxy-ws)
        uses: actions/checkout@v4
        with:
          repository: Another-TGProxy/mtproxy-ws
          path: _core

      - name: Set up MSYS2 (ucrt64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vala
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-ca-certificates
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-vulkan-loader

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build app + installer (setup)
        env:
          CORE_SRC: _core
          MAKENSIS: /c/Program Files (x86)/NSIS/makensis.exe
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash packaging/windows/bundle-windows.sh

      - name: Upload installer
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: another-tgproxy-windows-x86_64
          path: AnotherTGProxy-*-windows-x86_64-setup.exe
          retention-days: 14

      # SignPath pulls the uploaded artifact, Authenticode-signs it and returns
      # the signed installer; only runs on a release tag with secrets configured.
      - name: Sign installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          project-slug: another-tgproxy
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed installer for the release
        if: env.SIGN == 'true'
        shell: bash
        run: cp -f signed/AnotherTGProxy-*-windows-x86_64-setup.exe ./

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AnotherTGProxy-*-windows-x86_64-setup.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
