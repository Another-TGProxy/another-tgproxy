name: Release

# Sole creator of the GitHub Release. The platform workflows (windows/macos/
# appimage/android/flatpak-bundle) only upload Actions artifacts on a tag; this
# workflow validates the tag, waits for all of them, collects their artifacts,
# writes SHA256SUMS and publishes one atomic release. No platform attaches files
# directly, so there is no race and a partial release is impossible.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  # --- #2 version guard: a tag can't be wrong ---------------------------------
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need all tags for the "newer than last release" check
      - name: Validate tag
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"          # e.g. v2.1.0-beta1
          V="${TAG#v}"
          # 1. semver shape
          echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::tag $TAG is not semver (vMAJOR.MINOR.PATCH[-pre])"; exit 1; }
          # 2. release core (minus any -prerelease) must equal meson project version
          MV=$(sed -n "s/.*version: '\([0-9.]*\)'.*/\1/p" meson.build | head -1)
          CORE="${V%%-*}"
          [ "$CORE" = "$MV" ] \
            || { echo "::error::tag core $CORE != meson.build version $MV"; exit 1; }
          # 3. strictly newer than the latest existing release tag. Map '-' to '~'
          # so a prerelease sorts BELOW its release (sort -V treats ~ specially),
          # matching semver (2.1.0-beta1 < 2.1.0).
          cur=$(echo "$V" | tr '-' '~')
          prev=$(git tag -l 'v*' | grep -vx "$TAG" | sed 's/^v//' | tr '-' '~' \
                 | sort -V | tail -1)
          if [ -n "$prev" ]; then
            newest=$(printf '%s\n%s\n' "$prev" "$cur" | sort -V | tail -1)
            { [ "$newest" = "$cur" ] && [ "$cur" != "$prev" ]; } \
              || { echo "::error::tag $V is not newer than last release ${prev//\~/-}"; exit 1; }
          fi
          echo "guard OK: $TAG (meson $MV, previous ${prev//\~/-:-none})"

  # --- #3 wait for every platform, collect, checksum, publish once ------------
  finalize:
    needs: guard
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # The platform workflows that produce a release artifact for this tag.
      WORKFLOWS: windows.yml macos.yml appimage.yml android.yml flatpak-bundle.yml
    steps:
      - uses: actions/checkout@v6

      - name: Wait for all platform builds (this commit)
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          deadline=$(( $(date +%s) + 75*60 ))   # up to 75 min
          for wf in $WORKFLOWS; do
            echo "::group::wait $wf"
            while :; do
              row=$(gh run list --workflow="$wf" --commit="$SHA" --event push \
                    --limit 1 --json status,conclusion,databaseId -q '.[0]' 2>/dev/null || true)
              status=$(printf '%s' "$row" | jq -r '.status // "missing"')
              if [ "$status" = completed ]; then
                concl=$(printf '%s' "$row" | jq -r '.conclusion // ""')
                [ "$concl" = success ] \
                  || { echo "::error::$wf concluded '$concl' — aborting release"; exit 1; }
                echo "$wf: success"; break
              fi
              [ "$(date +%s)" -lt "$deadline" ] \
                || { echo "::error::timed out waiting for $wf (status=$status)"; exit 1; }
              sleep 20
            done
            echo "::endgroup::"
          done

      - name: Download every platform's artifacts
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          mkdir -p assets
          for wf in $WORKFLOWS; do
            rid=$(gh run list --workflow="$wf" --commit="$SHA" --event push --limit 1 \
                  --json databaseId -q '.[0].databaseId')
            gh run download "$rid" -D "dl/$wf"
          done
          # Flatten the release-worthy files into assets/.
          find dl -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \
            -o -name '*.flatpak' -o -name '*.apk' \) -exec cp -v {} assets/ \;
          echo "collected:"; ls -1 assets

      - name: SHA256SUMS
        run: |
          set -euo pipefail
          ( cd assets && sha256sum -- * > SHA256SUMS )
          cat assets/SHA256SUMS

      - name: Publish the release
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          # prerelease iff the tag carries a -suffix (e.g. v2.1.0-beta1)
          pre=(); case "$TAG" in *-*) pre=(--prerelease);; esac
          # Body: RELEASE_NOTES.md if present, else autogenerated notes.
          if [ -f RELEASE_NOTES.md ]; then notes=(--notes-file RELEASE_NOTES.md)
          else notes=(--generate-notes); fi
          gh release create "$TAG" assets/* --title "$TAG" "${pre[@]}" "${notes[@]}"
          echo "released $TAG with $(ls -1 assets | wc -l) files"
