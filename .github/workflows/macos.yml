name: macOS

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: &paths
      - 'src/**'
      - 'data/**'
      - 'po/**'
      - 'meson.build'
      - 'subprojects/**'
      - 'packaging/macos/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Apple Silicon only: the Intel (macos-13) runners are gone, and a Homebrew
  # build can't be lipo'd universal (the deps are single-arch), so we ship arm64.
  build:
    runs-on: macos-15
    env:
      arch: arm64
    steps:
      - name: Checkout GUI
        uses: actions/checkout@v4

      - name: Checkout core (mtproxy-ws)
        uses: actions/checkout@v4
        with:
          repository: Another-TGProxy/mtproxy-ws
          path: _core

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-macos-${{ env.arch }}-${{ hashFiles('.github/workflows/macos.yml') }}

      - name: Install dependencies
        run: |
          brew update --quiet || true
          brew install \
            meson ninja pkg-config \
            vala blueprint-compiler \
            gtk4 libadwaita json-glib \
            openssl@3 gettext \
            adwaita-icon-theme librsvg \
            dylibbundler create-dmg desktop-file-utils

      - name: Build app + bundle .app/.dmg
        env:
          CORE_SRC: _core
        run: bash packaging/macos/bundle-macos.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: another-tgproxy-macos-${{ env.arch }}
          path: dist/*.dmg
          retention-days: 14

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
