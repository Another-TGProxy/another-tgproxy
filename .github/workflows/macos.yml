name: macOS

on:
  push:
    branches: [main, devel]
    tags: ['v*']
    paths: &paths
      - 'src/**'
      - 'data/**'
      - 'po/**'
      - 'meson.build'
      - 'subprojects/**'
      - 'packaging/macos/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

# One run per branch; a new push cancels the previous build. Tags (releases) are
# never cancelled so a release build always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  # Apple Silicon only. x86_64 used to build on the same runner under Rosetta
  # against a parallel Intel Homebrew in /usr/local; that stopped working when
  # Homebrew dropped Intel macOS ("Homebrew on macOS is only supported on Apple
  # Silicon processors!"), and there are no Intel runners left to fall back to.
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    steps:
      - name: Checkout GUI
        uses: actions/checkout@v6

      # core (mtproxy-ws) + libstation are vendored meson subprojects pinned in
      # subprojects/*.wrap and built in-tree by the GUI build; no core checkout.
      - name: Cache Homebrew downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-macos-${{ matrix.arch }}-${{ hashFiles('.github/workflows/macos.yml') }}

      # ---- arm64: native Homebrew (/opt/homebrew) ----
      - name: Install dependencies (arm64)
        if: matrix.arch == 'arm64'
        run: |
          brew update --quiet || true
          brew install \
            meson ninja pkg-config \
            vala blueprint-compiler \
            gtk4 libadwaita json-glib glib-networking \
            openssl@3 gettext \
            adwaita-icon-theme librsvg \
            dylibbundler create-dmg desktop-file-utils

      - name: Build app + bundle .app/.dmg (arm64)
        if: matrix.arch == 'arm64'
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash packaging/macos/bundle-macos.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: another-tgproxy-macos-${{ matrix.arch }}
          path: dist/*.dmg
          retention-days: 14
        # On a tag, release.yml collects this artifact and publishes the release.
