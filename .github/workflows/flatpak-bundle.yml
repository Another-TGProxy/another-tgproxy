name: Flatpak bundle

# Builds a single-file .flatpak bundle and attaches it to the release. (The
# separate publish-flatpak.yml pushes to the Ampernic Flatpak repo instead.)
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: &paths
      - 'src/**'
      - 'data/**'
      - 'po/**'
      - 'meson.build'
      - 'packaging/flatpak/**'
      - '.github/workflows/flatpak-bundle.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Render manifest (pin core + gui commits)
        run: |
          set -euo pipefail
          CORE=https://github.com/Another-TGProxy/mtproxy-ws.git
          CORE_COMMIT=$(git ls-remote "$CORE" refs/heads/main | cut -f1)
          sed -e "s/__CORE_COMMIT__/$CORE_COMMIT/g" \
              -e "s/__GUI_COMMIT__/${{ github.sha }}/g" \
              packaging/flatpak/space.ampernic.AnotherTGProxy.yml \
              > packaging/flatpak/_rendered.yml
          VERSION=$(sed -n "s/.*version: '\([0-9.]*\)'.*/\1/p" meson.build | head -1)
          echo "BUNDLE=AnotherTGProxy-$VERSION-linux-x86_64.flatpak" >> "$GITHUB_ENV"

      - name: Build .flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.BUNDLE }}
          manifest-path: packaging/flatpak/_rendered.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: another-tgproxy-flatpak
          path: ${{ env.BUNDLE }}
          retention-days: 14

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUNDLE }}
          prerelease: ${{ contains(github.ref_name, '-') }}
