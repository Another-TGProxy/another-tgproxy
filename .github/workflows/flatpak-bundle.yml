name: Flatpak bundle

# Builds a single-file .flatpak bundle and attaches it to the release. (The
# separate publish-flatpak.yml pushes to the Ampernic Flatpak repo instead.)
on:
  push:
    branches: [main, devel]
    tags: ['v*']
    paths: &paths
      - 'src/**'
      - 'data/**'
      - 'po/**'
      - 'meson.build'
      - 'packaging/flatpak/**'
      - '.github/workflows/flatpak-bundle.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

# One run per branch; a new push cancels the previous build. Tags (releases) are
# never cancelled so a release build always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - name: Render manifest (pin core + gui commits)
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          # core + libstation commits come from the pinned wraps — the single
          # source of truth shared with every other platform (the Flatpak
          # manifest builds them as modules, so pkg-config finds them and the
          # meson subproject fallback is never used, same as the ALT build).
          CORE_COMMIT=$(sed -n 's/^revision = //p' subprojects/mtproxy-ws.wrap | head -1)
          STATION_COMMIT=$(sed -n 's/^revision = //p' subprojects/libstation.wrap | head -1)
          QSHUB_COMMIT=$(sed -n 's/^revision = //p' subprojects/quick-settings-hub.wrap | head -1)
          VERSION="${RELEASE_VERSION#v}"
          [ -n "$VERSION" ] || VERSION=$(sed -n "s/.*version: '\([0-9.]*\)'.*/\1/p" meson.build | head -1)
          BASE_ID=space.ampernic.AnotherTGProxy
          # A release tag bundles the plain app; an untagged build bundles the
          # development build (.Devel app-id + striped header), matching the other
          # platforms and the Flatpak repo's devel channel.
          if [ -n "${RELEASE_VERSION:-}" ]; then
            APP_ID=$BASE_ID
            VOPT="s|__GUI_VERSION_OPT__|-Drelease_version=$VERSION|g"
            POPT="/__GUI_PROFILE_OPT__/d"
            SUFFIX=""
          else
            APP_ID=$BASE_ID.Devel
            VOPT="/__GUI_VERSION_OPT__/d"
            POPT="s|__GUI_PROFILE_OPT__|-Dprofile=development|"
            SUFFIX="-devel"
          fi
          sed -e "s/__CORE_COMMIT__/$CORE_COMMIT/g" \
              -e "s/__GUI_COMMIT__/${{ github.sha }}/g" \
              -e "s/__STATION_COMMIT__/$STATION_COMMIT/g" \
              -e "s/__QSHUB_COMMIT__/$QSHUB_COMMIT/g" \
              -e "s/__APP_ID__/$APP_ID/g" \
              -e "$VOPT" \
              -e "$POPT" \
              packaging/flatpak/space.ampernic.AnotherTGProxy.yml \
              > packaging/flatpak/_rendered.yml
          echo "BUNDLE=AnotherTGProxy-$VERSION$SUFFIX-linux-x86_64.flatpak" >> "$GITHUB_ENV"

      - name: Build .flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.BUNDLE }}
          manifest-path: packaging/flatpak/_rendered.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: another-tgproxy-flatpak
          path: ${{ env.BUNDLE }}
          retention-days: 14
        # On a tag, release.yml collects this artifact and publishes the release.
