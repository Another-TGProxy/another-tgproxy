name: Android (experimental)

# Validates the GTK-on-Android (Pixiewood) pipeline on a runner: it has the disk
# and lets us install the full toolchain. Stage 1 builds a minimal GTK4/libadwaita
# demo APK; once that is green the real (ported) app reuses the same pipeline.
on:
  workflow_dispatch:
  push:
    paths:
      - 'packaging/android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  demo-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk || true
          df -h /

      - name: Host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build sassc glslc libxml2-utils \
            libglib2.0-dev-bin gobject-introspection python3 \
            libglib-perl libglib-object-introspection-perl libipc-run-perl \
            libjson-perl libset-scalar-perl libxml-libxml-perl libxml-libxslt-perl \
            gir1.2-appstream-1.0 openjdk-17-jdk-headless

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + platform + build-tools
        run: |
          yes | sdkmanager --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1" >/dev/null
          ls "$ANDROID_HOME/ndk"

      - name: Forked meson (android branch) + Pixiewood
        run: |
          git clone --depth 1 -b android-apk https://github.com/sp1ritCS/meson "$RUNNER_TEMP/meson"
          git clone --depth 1 https://github.com/sp1ritCS/gtk-android-builder "$RUNNER_TEMP/pw"
          # Recent GTK's Android backend uses API-35 keycodes (AKEYCODE_KEYBOARD_BACKLIGHT_*,
          # Android 15); Pixiewood pins the NDK clang target to API 31. Bump it to 35.
          sed -i "s/+'31-clang/+'35-clang/g" "$RUNNER_TEMP/pw/prepare/android.cross"
          # Pixiewood needs the FORKED meson everywhere (only it understands
          # android_exe_type), both via --meson and as plain `meson` on PATH.
          printf '#!/bin/sh\nexec python3 "%s/meson.py" "$@"\n' "$RUNNER_TEMP/meson" \
            | sudo tee /usr/local/bin/meson >/dev/null
          sudo chmod +x /usr/local/bin/meson
          meson --version

      - name: Build demo APK (Pixiewood)
        working-directory: packaging/android/demo
        run: |
          set -x
          PW="$RUNNER_TEMP/pw/pixiewood"
          perl "$PW" prepare pixiewood.xml \
            --sdk "$ANDROID_HOME" \
            --android-studio-dir "$ANDROID_HOME" \
            --meson /usr/local/bin/meson -v
          perl "$PW" generate -v
          perl "$PW" build

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android-apks"
          find packaging/android/demo -name '*.apk' -exec cp -v {} "$GITHUB_WORKSPACE/android-apks/" \;
          ls -la "$GITHUB_WORKSPACE/android-apks/" || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adwdemo-apk
          path: android-apks/*.apk
          if-no-files-found: warn
