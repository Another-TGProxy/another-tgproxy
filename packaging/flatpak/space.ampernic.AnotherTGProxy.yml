# The single Flatpak manifest for this app: it pulls both components (core + GUI)
# by commit so the build is self-contained and reproducible. CI fills the
# __*_COMMIT__ placeholders in .github/workflows/publish-flatpak.yml and dispatches
# it to the Ampernic Flatpak repo. To build locally, substitute the placeholders
# with concrete commits first (see the README).
app-id: space.ampernic.AnotherTGProxy
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: another-tgproxy

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.gnome.Shell.Extensions.QuickSettingsHub

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/vala
  - '*.a'

modules:
  - name: mtproxy-ws
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - --libdir=lib   # keep the .pc + lib in /app/lib/pkgconfig (pkg-config's search path);
                       # some flatpak-builder versions default libdir to lib64, which hides it
    sources:
      - type: git
        url: https://github.com/Another-TGProxy/mtproxy-ws.git
        commit: __CORE_COMMIT__

  - name: another-tgproxy
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - --libdir=lib   # vendored libstation .so lands in /app/lib (on ld's path)
      - __GUI_VERSION_OPT__   # CI replaces with -Drelease_version=<tag>, or drops it
    sources:
      - type: git
        url: https://github.com/Another-TGProxy/another-tgproxy.git
        commit: __GUI_COMMIT__
      # libstation is consumed as a meson subproject (the libstation.wrap in
      # subprojects/). The Flatpak build has no network, so place its checkout at
      # subprojects/libstation: meson then reuses it instead of cloning the wrap.
      - type: git
        url: https://github.com/Ampernic/libstation.git
        commit: __STATION_COMMIT__
        dest: subprojects/libstation
      # libqshub is the qshub-1 subproject (the quick-settings-hub.wrap). No network
      # in the Flatpak build, so place its checkout at subprojects/quick-settings-hub.
      - type: git
        url: https://altlinux.space/ampernic/quick-settings-hub.git
        commit: __QSHUB_COMMIT__
        dest: subprojects/quick-settings-hub
